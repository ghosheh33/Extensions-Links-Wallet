<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>محفظة الروابط</h2>
    </header>
    
    <div class="compact-form">
      <input type="text" id="titleInput" placeholder="عنوان الصفحة" />
      <input type="text" id="categoryInput" placeholder="الفئة (مثال: أدوات، تطوير)" list="categoryList" />
      <datalist id="categoryList"></datalist>
      <input type="hidden" id="urlInput" />
      <div class="button-group">
        <button id="saveBtn" class="primary-btn">حفظ</button>
        <button id="cancelEditBtn" class="secondary-btn hidden">إلغاء</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="بحث بالاسم أو الفئة..." />
    </div>

    <div id="linksContainer" class="links-container">
    </div>
  </div>

  <div id="notification" class="notification hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
